<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Chùa Online 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1712;--gold:#e8bf5a;--lac:#7a1f17;--paper:#f6e9c9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a0f0b;font-family:'Noto Serif',Georgia,serif;color:var(--paper);touch-action:none}
canvas{display:block}
.box{position:fixed;padding:8px 12px;background:rgba(43,23,18,.76);border:1px solid rgba(232,191,90,.55);border-radius:10px;font-size:13px;line-height:1.55}
#hud{top:max(8px,env(safe-area-inset-top));left:8px}
#hud b{color:var(--gold)}
#chat{top:max(8px,env(safe-area-inset-top));right:8px;width:min(310px,54vw);padding:6px}
#log{height:150px;overflow-y:auto;font-size:12.5px;padding:2px 4px}
#log div{margin:2px 0;word-break:break-word}
#log .n{color:var(--gold);font-weight:700}#log .s{color:#c9b98f;font-style:italic}#log .x{color:#ff8a6b;font-weight:700}
#ci{width:100%;margin-top:4px;padding:7px;border-radius:6px;border:1px solid var(--gold);background:#1a0f0b;color:var(--paper);font:inherit;font-size:13px}
#acts{right:8px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0}
button{font:inherit;font-weight:700;font-size:14px;padding:11px 14px;border-radius:10px;border:1px solid var(--gold);background:var(--lac);color:var(--paper);cursor:pointer}
button:active{background:#a32b1f}
#stick{position:fixed;left:18px;bottom:max(18px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;border:1px solid rgba(232,191,90,.6);background:rgba(43,23,18,.45)}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:var(--gold);opacity:.85}
#toast{left:50%;bottom:150px;transform:translateX(-50%);opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#don{left:50%;top:50%;transform:translate(-50%,-50%);display:none;text-align:center;padding:16px}
#don button{margin:4px}
#start{inset:0;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 35%,#7a1f17,#1a0f0b 75%);text-align:center;z-index:9}
#start h1{font-size:clamp(30px,8vw,54px);margin:0;color:var(--gold);letter-spacing:.02em}
#start input{padding:11px;width:min(260px,80vw);text-align:center;font:inherit;border-radius:8px;border:1px solid var(--gold);background:#1a0f0b;color:var(--paper)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
#kn{left:50%;top:38%;transform:translate(-50%,-50%);display:none;font-size:clamp(26px,7vw,52px);color:#ff6a4a;font-weight:700;background:rgba(20,5,3,.85);text-align:center}
.hide{display:none!important}
@media(max-width:640px){#hud{font-size:11.5px}}
</style></head><body>
<div id="hud" class="box">🏯 <b>Chùa Online</b> · <span id="on">1</span> người<br>Tổng công đức: <b id="tot">0</b>đ<br>Ví của bạn: <b id="bal">1.000.000</b>đ</div>
<div id="chat" class="box"><div id="log"></div><input id="ci" maxlength="120" placeholder="Nói điều lành…" autocomplete="off"></div>
<div id="acts" class="box"><button id="bInc">🪔 Thắp hương</button><button id="bKn">🙏 Quỳ lạy</button><button id="bDon">💰 Công đức</button></div>
<div id="stick"><div id="knob"></div></div>
<div id="toast" class="box"></div>
<div id="don" class="box"><div>Chọn số tiền công đức</div><button data-a="10000">10.000đ</button><button data-a="50000">50.000đ</button><button data-a="100000">100.000đ</button><button data-a="500000">500.000đ</button><br><button id="dx" style="background:#2b1712">Đóng</button></div>
<div id="kn" class="box">⚡ KHẨU NGHIỆP ⚡<br><small>Phật quật vì buông lời ác</small></div>
<div id="flash"></div>
<div id="start" class="box"><h1>Chùa Online</h1><div>Dâng hương, quỳ lạy, gieo công đức cùng mọi người.<br>Lời ác khẩu sẽ bị Phật quật.</div>
<input id="nm" maxlength="16" placeholder="Pháp danh / tên của bạn"><button id="go">Vào chùa</button>
<small id="mode" style="opacity:.7"></small><small style="opacity:.7">WASD / phím mũi tên để đi · kéo chuột để xoay · lăn chuột để zoom</small></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=i=>document.getElementById(i),now=()=>performance.now();
const fmt=n=>n.toLocaleString('vi-VN');
const scene=new T.Scene();scene.background=new T.Color(0xe9b979);scene.fog=new T.Fog(0xe9b979,45,120);
const cam=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);
const rd=new T.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.setSize(innerWidth,innerHeight);
rd.shadowMap.enabled=true;document.body.prepend(rd.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rd.setSize(innerWidth,innerHeight)});
const M=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.75},o));
const add=(o,x,y,z,p)=>{o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;(p||scene).add(o);return o};
const B=(w,h,d,m,x,y,z,p)=>add(new T.Mesh(new T.BoxGeometry(w,h,d),m),x,y,z,p);
const C=(a,b,h,m,x,y,z,p,s=16)=>add(new T.Mesh(new T.CylinderGeometry(a,b,h,s),m),x,y,z,p);
const S=(r,m,x,y,z,p,sc)=>{const o=add(new T.Mesh(new T.SphereGeometry(r,20,14),m),x,y,z,p);if(sc)o.scale.set(...sc);return o};
const LAC=M(0x8b1e14),GOLD=M(0xe0aa3a,{metalness:.65,roughness:.32,emissive:0x3a2600}),TILE=M(0x5a2a1c),STONE=M(0xc9bda3),WOOD=M(0x6b3f26);

// ---- Ánh sáng
scene.add(new T.HemisphereLight(0xffe6bf,0x6b4a2a,.85));
const sun=new T.DirectionalLight(0xffd9a0,1.1);sun.position.set(-20,32,24);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,far:100});scene.add(sun);
const warm=new T.PointLight(0xffb060,1.1,34);warm.position.set(0,6,-24);scene.add(warm);

// ---- Mặt đất & sân
B(160,.2,160,M(0x5f8050),0,-.1,0);
B(9,.1,44,STONE,0,.02,8);B(40,.1,12,STONE,0,.02,4);
const fl=document.createElement('canvas');fl.width=fl.height=128;const fx=fl.getContext('2d');fx.fillStyle='#8c5a3a';fx.fillRect(0,0,128,128);
for(let i=0;i<8;i++){fx.fillStyle=i%2?'#7d4e32':'#98633f';fx.fillRect(0,i*16,128,15)}
const ft=new T.CanvasTexture(fl);ft.wrapS=ft.wrapT=T.RepeatWrapping;ft.repeat.set(12,10);
B(32,.5,26,M(0xffffff,{map:ft}),0,.25,-20);
for(let i=0;i<3;i++)B(14-i*1.5,.18,1,STONE,0,.1+i*.0,-6.4+i*.0);

// ---- Chính điện: cột, kèo, mái
[-13,13].forEach(x=>[-9,-15,-21,-27].forEach(z=>{C(.55,.6,8,LAC,x,4.5,z);C(.75,.75,.3,GOLD,x,.65,z);B(1.2,.5,1.2,GOLD,x,8.6,z)}));
B(32,9,.6,M(0x8b2a1c),0,5,-33);
[-9,-15,-21,-27].forEach(z=>B(32,.6,.6,LAC,0,8.3,z));[-13,13].forEach(x=>B(.6,.6,26,LAC,x,8.3,-20));
B(36,.5,30,TILE,0,9,-20);
const rg=new T.ConeGeometry(1,1,4);rg.rotateY(Math.PI/4);
const roof=add(new T.Mesh(rg,TILE),0,12.2,-20);roof.scale.set(25.4,6.4,21.2);
C(.1,.5,1.5,GOLD,0,15.7,-20);S(.4,GOLD,0,16.6,-20);
[[-18,-35],[18,-35],[-18,-5],[18,-5]].forEach(([x,z])=>{const o=add(new T.Mesh(new T.ConeGeometry(.5,1.8,4),GOLD),x,9.8,z);o.rotation.z=x<0?.9:-.9});
// đèn lồng
const LAN=M(0xd62b1c,{emissive:0xb01808,emissiveIntensity:.9});
[-9,-13,-17,-21,-25].forEach(z=>[-9,0,9].forEach(x=>{S(.5,LAN,x,7,z,null,[1,1.3,1]);C(.02,.02,1.2,GOLD,x,8.1,z)}));

// ---- Bàn thờ & tượng Phật
B(14,1,5,LAC,0,1,-30.2);B(9,.8,3.6,M(0x4a1a12),0,1.9,-30.5);B(15,.15,5.4,GOLD,0,1.55,-30.2);
const bd=new T.Group();bd.position.set(0,2.3,-30.5);scene.add(bd);
C(2.3,2.6,.5,M(0xf2b6c4),0,.25,0,bd,24);
for(let i=0;i<12;i++){const a=i/12*Math.PI*2,o=S(.5,M(0xf7c9d4),Math.cos(a)*2.35,.55,Math.sin(a)*2.35,bd,[1,.35,1.6]);o.rotation.y=-a}
S(1.5,GOLD,0,1,0,bd,[1.8,.5,1.15]);
C(1,1.55,2.2,GOLD,0,2,0,bd,20);
S(.82,GOLD,0,3.65,.05,bd);S(.3,GOLD,0,4.45,.05,bd);
S(.2,M(0x222222),-.28,3.72,.75,bd);S(.2,M(0x222222),.28,3.72,.75,bd);
S(.38,GOLD,-.9,1.7,.8,bd);S(.38,GOLD,.9,1.7,.8,bd);S(.4,GOLD,0,1.4,1.1,bd);
const halo=new T.Mesh(new T.CircleGeometry(1.9,40),new T.MeshBasicMaterial({color:0xffe9a0,transparent:true,opacity:.55}));halo.position.set(0,3.8,-.6);bd.add(halo);
bd.add(Object.assign(new T.Mesh(new T.TorusGeometry(1.9,.07,8,40),GOLD),{position:new T.Vector3(0,3.8,-.58)}));
[-5.2,5.2].forEach(x=>{C(.4,.3,.9,M(0x2d6fa3),x,2.5,-30,null);for(let i=0;i<5;i++)S(.32,M(i%2?0xff9ec2:0xffd2e0),x+(i-2)*.22,3.2+(i%2)*.2,-30)});
[-3.6,3.6].forEach(x=>{C(.2,.2,1,M(0xd62b1c),x,2.8,-29.3);S(.1,M(0xffdd66,{emissive:0xffaa22}),x,3.4,-29.3)});

// ---- Lư hương
const urn=new T.Group();urn.position.set(0,.5,-24);scene.add(urn);
const BR=M(0x8a5a2a,{metalness:.7,roughness:.4});
C(1.2,.9,1.1,BR,0,1.1,0,urn,24);C(1.3,1.3,.15,BR,0,1.7,0,urn,24);
[0,2.1,4.2].forEach(a=>C(.15,.1,.6,BR,Math.cos(a)*.8,.3,Math.sin(a)*.8,urn));
const sticks=[];for(let i=0;i<15;i++){const a=i*2.4,r=.15+(i%5)*.13,g=new T.Group();g.position.set(Math.cos(a)*r,1.7,Math.sin(a)*r);
 C(.025,.025,1.6,M(0xa04020),0,.8,0,g,6);S(.06,M(0xff3300,{emissive:0xff2200,emissiveIntensity:2}),0,1.62,0,g);g.visible=false;urn.add(g);sticks.push(g)}
const sm=document.createElement('canvas');sm.width=sm.height=32;const sx=sm.getContext('2d'),gr=sx.createRadialGradient(16,16,0,16,16,16);
gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');sx.fillStyle=gr;sx.fillRect(0,0,32,32);
const SP=70,spos=new Float32Array(SP*3),sg=new T.BufferGeometry();sg.setAttribute('position',new T.BufferAttribute(spos,3));
for(let i=0;i<SP;i++){spos[i*3+1]=Math.random()*5}
const smoke=new T.Points(sg,new T.PointsMaterial({size:.9,map:new T.CanvasTexture(sm),transparent:true,opacity:.28,depthWrite:false,color:0xdddddd}));smoke.position.set(0,2.3,-24);smoke.frustumCulled=false;scene.add(smoke);

// ---- Hòm công đức
B(1.6,2,1.6,LAC,9,1.5,-23);B(1.9,.25,1.9,GOLD,9,2.62,-23);B(.9,.08,.12,M(0x111111),9,2.76,-23);
// ---- Đệm quỳ
const cush=[];[-13,-16,-19].forEach(z=>[-6,-2,2,6].forEach(x=>{C(.72,.72,.2,M(0xe0822a),x,.6,z);add(new T.Mesh(new T.TorusGeometry(.7,.06,8,24),LAC),x,.7,z).rotation.x=Math.PI/2;cush.push([x,z])}));
// ---- Tam quan, cây, hồ sen
[-6,6].forEach(x=>B(1,6,1,LAC,x,3,30));B(14,1,1.2,LAC,0,6.2,30);B(17,.5,3.2,TILE,0,7.1,30);B(11,.4,2.4,TILE,0,7.6,30);
[-1,1].forEach(s=>B(1,2.4,1,STONE,s*3,1.2,31.5));
[[-15,6],[15,8],[-17,20],[17,22],[-24,-4],[24,-4]].forEach(([x,z])=>{C(.4,.5,3,WOOD,x,1.5,z);S(2.4,M(0x3f7a3a),x,4.2,z,null,[1,1.2,1]);S(1.7,M(0x4a8a42),x+.8,5.6,z)});
[-11,11].forEach(x=>{C(3.4,3.4,.12,M(0x4f8f86,{roughness:.2,metalness:.3}),x,.07,13,null,32);for(let i=0;i<4;i++){const a=i*1.6;S(.35,M(0xff9ec2),x+Math.cos(a)*1.5,.25,13+Math.sin(a)*1.5,null,[1,.6,1])}});

// ---- Nhãn chữ
function mkLabel(txt,o={}){const c=document.createElement('canvas');c.width=1024;c.height=128;const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthTest:false}));
 sp.userData.c=c;sp.renderOrder=9;sp.scale.set(o.w||5,(o.w||5)/8,1);setLabel(sp,txt,o);return sp}
function setLabel(sp,txt,o={}){const c=sp.userData.c,x=c.getContext('2d');x.clearRect(0,0,1024,128);if(!txt){sp.visible=false;return}sp.visible=true;
 x.font=`700 ${o.f||50}px "Noto Serif",serif`;const w=Math.min(x.measureText(txt).width+44,1020);x.fillStyle=o.bg||'rgba(43,23,18,.78)';
 x.beginPath();x.roundRect?x.roundRect(512-w/2,20,w,88,22):x.rect(512-w/2,20,w,88);x.fill();x.fillStyle=o.fg||'#f6e9c9';x.textAlign='center';x.textBaseline='middle';
 x.fillText(txt.length>46?txt.slice(0,45)+'…':txt,512,66);sp.material.map.needsUpdate=true}
const sign=mkLabel('Công đức',{w:3,f:60,fg:'#e8bf5a'});sign.position.set(9,3.8,-23);scene.add(sign);

// ---- Nhân vật
const COL=[0x9b5a2a,0x8a8a5c,0x6b4a7a,0x3f6f6a,0xb0602e,0x5b6f9a,0x7a3b3b];
function avatar(ci,name){const g=new T.Group(),b=new T.Group();g.add(b);
 C(.38,.62,1.5,M(COL[ci]),0,.75,0,b,12);C(.4,.4,.12,GOLD,0,1,0,b,12);S(.28,M(0xf0c9a0),0,1.8,0,b);
 add(new T.Mesh(new T.SphereGeometry(.295,16,8,0,6.29,0,1.75),M(0x1a1210)),0,1.83,0,b);
 S(.22,M(0xf0c9a0),-.5,1.1,.3,b);S(.22,M(0xf0c9a0),.5,1.1,.3,b);
 const nm=mkLabel(name,{w:3.4,f:46});nm.position.y=2.55;g.add(nm);const bu=mkLabel('',{w:6,f:44});bu.position.y=3.15;g.add(bu);scene.add(g);
 return{g,b,nm,bu,x:0,z:0,r:0,k:0,fall:0,say:0,id:0}}
let me=null,myId=0,ws=null,online=false,total=0,bal=1000000,incN=0,offInc=[];
const others={};

// ---- Log / toast / âm thanh
function log(n,t,c){const d=document.createElement('div');d.innerHTML=(n?`<span class="n"></span> `:'')+'<span class="t"></span>';if(n)d.firstChild.textContent=n+':';d.lastChild.textContent=t;if(c)d.className=c;$('log').appendChild(d);while($('log').children.length>40)$('log').firstChild.remove();$('log').scrollTop=1e9}
let tt;function toast(s){const e=$('toast');e.textContent=s;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,2200)}
let ac;function gong(f=110){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.4,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+2.5);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+2.5)}catch(e){}}
function hud(){$('tot').textContent=fmt(total);$('bal').textContent=fmt(bal);$('on').textContent=online?Object.keys(others).length+1:1}

// ---- Phật quật
function smite(p,name){if(!p)return;const bolt=C(.14,.14,24,new T.MeshBasicMaterial({color:0xfff2a0}),p.g.position.x,12,p.g.position.z);
 setTimeout(()=>scene.remove(bolt),450);$('flash').style.opacity=.85;setTimeout(()=>$('flash').style.opacity=0,120);gong(70);
 p.fall=now()+3500;p.k=0;setLabel(p.bu,'KHẨU NGHIỆP!',{bg:'rgba(160,20,10,.92)',fg:'#fff',f:54});p.say=now()+4000;
 log('',`⚡ ${name} bị Phật quật vì khẩu nghiệp`,'x');if(p===me){$('kn').style.display='block';setTimeout(()=>$('kn').style.display='none',3200)}}

// ---- Mạng
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){if(location.protocol==='file:'){$('mode').textContent='Chế độ offline (mở qua server Render để chơi online)';return}
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{online=true;send({t:'join',name:me.name,c:me.ci})};
 ws.onclose=()=>{online=false;log('','Mất kết nối, đang thử lại…','s');setTimeout(connect,2500)};
 ws.onmessage=e=>{const d=JSON.parse(e.data);
  if(d.t==='init'){myId=d.id;total=d.total;incN=d.n;hud()}
  else if(d.t==='state'){incN=d.n;const seen={};d.p.forEach(q=>{if(q.id===myId)return;seen[q.id]=1;let o=others[q.id];if(!o){o=others[q.id]=avatar(q.c,q.n);o.id=q.id;o.g.position.set(q.x,0,q.z)}
    o.tx=q.x;o.tz=q.z;o.r=q.r;o.k=q.k});for(const id in others)if(!seen[id]){scene.remove(others[id].g);delete others[id]}hud()}
  else if(d.t==='chat'){log(d.name,d.text);const o=d.id===myId?me:others[d.id];if(o){setLabel(o.bu,d.text);o.say=now()+5000}}
  else if(d.t==='smite')smite(d.id===myId?me:others[d.id],d.name);
  else if(d.t==='incense'){incN=d.n;gong(130);log('',`🪔 ${d.name} đã thắp hương`,'s')}
  else if(d.t==='donate'){total=d.total;log('',`💰 ${d.name} công đức ${fmt(d.amount)}đ`,'s');gong(220);hud()}
  else if(d.t==='sys')log('',d.text,'s')}}

// ---- Điều khiển
const keys={};addEventListener('keydown',e=>{if(document.activeElement===$('ci')){if(e.key==='Enter'){const t=$('ci').value.trim();$('ci').value='';$('ci').blur();if(t){online?send({t:'chat',text:t}):toast('Chat cần server online')}}return}
 if(e.key==='Enter'){$('ci').focus();e.preventDefault();return}keys[e.key.toLowerCase()]=1});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let th=0,ph=.45,D=9,drag=null,joy={x:0,y:0};
rd.domElement.addEventListener('pointerdown',e=>drag={x:e.clientX,y:e.clientY});
addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag)return;th-=(e.clientX-drag.x)*.006;ph=Math.min(1.2,Math.max(.12,ph+(e.clientY-drag.y)*.004));drag={x:e.clientX,y:e.clientY}});
addEventListener('wheel',e=>D=Math.min(16,Math.max(4,D+e.deltaY*.01)));
const st=$('stick');let sid=null;
st.addEventListener('pointerdown',e=>{sid=e.pointerId;st.setPointerCapture(sid);e.stopPropagation()});
st.addEventListener('pointermove',e=>{if(e.pointerId!==sid)return;const r=st.getBoundingClientRect();let x=(e.clientX-r.left-55)/45,y=(e.clientY-r.top-55)/45,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}joy={x,y:-y};$('knob').style.transform=`translate(${x*35}px,${y*35}px)`});
st.addEventListener('pointerup',()=>{sid=null;joy={x:0,y:0};$('knob').style.transform=''});

const dist=(x,z)=>Math.hypot(me.x-x,me.z-z);
$('bInc').onclick=()=>{if(dist(0,-24)>5)return toast('Hãy lại gần lư hương');gong(130);
 if(online)send({t:'incense'});else{offInc=offInc.filter(t=>t>now());if(offInc.length<15)offInc.push(now()+90000);incN=offInc.length}toast('Nam mô A Di Đà Phật 🪔')};
$('bKn').onclick=()=>{if(me.k){me.k=0;return}let best=null,bd2=2.4;cush.forEach(c=>{const d=dist(c[0],c[1]);if(d<bd2){bd2=d;best=c}});
 if(!best)return toast('Hãy lại gần đệm quỳ');me.x=best[0];me.z=best[1];me.r=Math.PI;me.k=1;gong(180);toast('Con xin lạy Phật 🙏')};
$('bDon').onclick=()=>{if(dist(9,-23)>4.5)return toast('Hãy lại gần hòm công đức');$('don').style.display='block'};
$('dx').onclick=()=>$('don').style.display='none';
document.querySelectorAll('#don [data-a]').forEach(b=>b.onclick=()=>{const a=+b.dataset.a;if(bal<a)return toast('Ví không đủ');bal-=a;$('don').style.display='none';
 if(online)send({t:'donate',amount:a});else{total+=a;gong(220)}toast(`Công đức ${fmt(a)}đ. Phúc lành đến với bạn 🙏`);hud()});

$('go').onclick=()=>{const n=$('nm').value.trim()||'Phật tử';me=avatar(Math.floor(Math.random()*7),n);me.ci=COL.indexOf(me.b.children[0].material.color.getHex());
 me.ci=Math.max(0,me.ci);me.name=n;me.x=0;me.z=24;me.r=Math.PI;me.g.position.set(0,0,24);$('start').classList.add('hide');gong(90);connect();log('','Chào mừng ' + n + ' đến chùa. Hãy giữ khẩu nghiệp thanh tịnh.','s');loop()};
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});

// ---- Vòng lặp
const blocks=[[0,-24,1.7],[9,-23,1.4]];let last=now(),sendT=0,sa=0;
function loop(){requestAnimationFrame(loop);const t=now(),dt=Math.min((t-last)/1000,.1);last=t;
 const fallen=t<me.fall;let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,iy=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)+joy.y;
 const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}
 if(!fallen&&l>.1){me.k=0;const px=me.x,pz=me.z,dx=-Math.sin(th)*iy+Math.cos(th)*ix,dz=-Math.cos(th)*iy-Math.sin(th)*ix;
  me.x+=dx*5*dt;me.z+=dz*5*dt;me.r=Math.atan2(dx,dz);
  if(me.z<-7&&Math.abs(me.x)>15.4){if(pz>=-7)me.z=-7;else me.x=Math.sign(me.x)*15.4}
  me.x=Math.max(-28,Math.min(28,me.x));me.z=Math.max(-26.8,Math.min(31,me.z));
  blocks.forEach(([bx,bz,r])=>{const d=Math.hypot(me.x-bx,me.z-bz);if(d<r){me.x=bx+(me.x-bx)/d*r;me.z=bz+(me.z-bz)/d*r}})}
 const inHall=z=>z<-7;const ground=(x,z)=>inHall(z)&&Math.abs(x)<16?.5:0;
 const gy=(me.k?.18:0)+ground(me.x,me.z);
 pose(me,me.x,me.z,gy,me.r,dt,t,true);
 for(const id in others){const o=others[id];o.g.position.x+=(o.tx-o.g.position.x)*Math.min(1,dt*10);o.g.position.z+=(o.tz-o.g.position.z)*Math.min(1,dt*10);
  pose(o,o.g.position.x,o.g.position.z,(o.k?.18:0)+ground(o.g.position.x,o.g.position.z),o.r,dt,t,false)}
 sendT+=dt;if(online&&sendT>.1){sendT=0;send({t:'move',x:me.x,z:me.z,r:me.r,k:me.k})}
 // hương & khói
 if(!online)incN=offInc.filter(x=>x>t).length;
 sticks.forEach((s,i)=>s.visible=i<incN);
 if(incN>0){for(let i=0;i<SP;i++){let y=spos[i*3+1]+dt*(.7+(i%5)*.1);if(y>5){y=0;spos[i*3]=(Math.random()-.5)*.6;spos[i*3+2]=(Math.random()-.5)*.6}spos[i*3+1]=y;spos[i*3]+=Math.sin(t*.001+i)*.004}sg.attributes.position.needsUpdate=true;smoke.visible=true}else smoke.visible=false;
 const y=me.g.position.y+1.6,cp=Math.cos(ph)*D;cam.position.set(me.g.position.x+Math.sin(th)*cp,Math.max(.6,y+Math.sin(ph)*D),Math.max(-31.5,me.g.position.z+Math.cos(th)*cp));
 cam.lookAt(me.g.position.x,y,me.g.position.z);rd.render(scene,cam)}
function pose(p,x,z,y,r,dt,t,self){if(self)p.g.position.set(x,y,z);else p.g.position.y=y;
 let d=r-p.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));p.g.rotation.y+=d*Math.min(1,dt*10);
 const f=t<p.fall;p.b.scale.y+=((p.k?.6:1)-p.b.scale.y)*Math.min(1,dt*12);p.b.rotation.x+=((f?-1.45:0)-p.b.rotation.x)*Math.min(1,dt*10);
 if(p.say&&t>p.say){p.say=0;setLabel(p.bu,'')}}
rd.render(scene,cam);
</script></body></html>
